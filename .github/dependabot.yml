version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      development-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      action-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      action-updates:
        applies-to: version-updates
        patterns:
          - "*"
